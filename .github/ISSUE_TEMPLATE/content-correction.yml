name: Content correction
description: Report a factual, methodological, terminology, or documentation problem.
title: "[Content]: "
labels: ["content"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location and current text
      description: Provide a repository path and quote only non-sensitive text.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction and evidence
      description: Explain applicability, limits, and a verifiable source when this changes a research criterion.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private, sensitive, and unpublished research information.
          required: true
