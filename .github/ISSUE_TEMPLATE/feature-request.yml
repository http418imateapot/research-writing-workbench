name: Feature request
description: Propose a template, workflow, validation, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users
      description: Describe the general problem without private cases.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and boundaries
      description: Include non-goals, evidence needs, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance and validation
      description: Explain how maintainers can verify the change.
    validations:
      required: true
