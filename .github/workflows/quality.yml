name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create repository virtual environment
        run: python -m venv .venv
      - name: Install development checks
        run: ${{ matrix.python }} -m pip install -r requirements-dev.txt
      - name: Compile project code
        run: ${{ matrix.python }} -m compileall -q build.py scripts tests
      - name: Run pytest
        run: ${{ matrix.python }} -m pytest -q
      - name: Validate repository
        run: ${{ matrix.python }} scripts/validate_repository.py
      - name: Scan privacy risks
        run: ${{ matrix.python }} scripts/privacy_scan.py
      - name: Check reproducible build assembly
        run: ${{ matrix.python }} build.py --check
      - name: Build local release candidate
        if: matrix.os == 'ubuntu-latest'
        run: |
          ${{ matrix.python }} build.py
          if [ -n "$(git ls-files dist)" ]; then
            echo "dist contains tracked files"
            exit 1
          fi
      - name: Upload local release candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: research-writing-workbench-local-candidate
          path: dist/
          if-no-files-found: error
